---
# Independent ground truth: ask the package database directly instead of
# trusting the module's return values. Sets fact: ncpa_pkg_installed (bool)
- name: Query RPM database for ncpa
  ansible.builtin.command:
    argv: [rpm, -q, ncpa]
  register: _ncpa_rpm_q
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == 'RedHat'

- name: Query dpkg database for ncpa
  ansible.builtin.command:
    argv: [dpkg-query, -W, -f, "${Status}", ncpa]
  register: _ncpa_dpkg_q
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == 'Debian'

- name: Record ncpa package state
  ansible.builtin.set_fact:
    ncpa_pkg_installed: >-
      {{ ((_ncpa_rpm_q.rc | default(1)) == 0)
         if ansible_facts.os_family == 'RedHat'
         else ('install ok installed' in (_ncpa_dpkg_q.stdout | default(''))) }}
