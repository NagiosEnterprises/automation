# Install the collection under test. Pick one:
#
# From a checkout of this repo (build first):
#   ansible-galaxy collection build .. --force
#   ansible-galaxy collection install ../community-nagios_cs-*.tar.gz --force
#
# Straight from GitHub:
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: git+https://github.com/ansible-collections/community.nagios_cs.git
    type: git
    version: main
